name: Build

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
            - 'release/**'
    workflow_dispatch:

jobs:
    py-ruff:
        runs-on: ubuntu-latest
        env:
            # Dependencies must install from wheels; only inspect_viz is built.
            UV_NO_BUILD: '1'
        strategy:
            matrix:
                python-version: ['3.11', '3.14']
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: meridianlabs-ai/actions/install-python-dependencies@6245f003b5628736e543468ca41f61a42549643f # main
              with:
                  versions: locked
                  python-version: ${{ matrix.python-version }}
                  extras: dev
            - name: Lint with Ruff
              run: uv run --no-sync ruff check
            - name: Format with Ruff
              run: uv run --no-sync ruff format --check
            - name: Minimize uv cache
              if: ${{ !cancelled() }}
              run: uv cache prune --ci

    py-mypy:
        runs-on: ubuntu-latest
        env:
            # Dependencies must install from wheels; only inspect_viz is built.
            UV_NO_BUILD: '1'
        strategy:
            matrix:
                python-version: ['3.11', '3.14']
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: meridianlabs-ai/actions/install-python-dependencies@6245f003b5628736e543468ca41f61a42549643f # main
              with:
                  versions: locked
                  python-version: ${{ matrix.python-version }}
                  extras: dev
            - name: Run mypy
              run: uv run --no-sync mypy src
            - name: Minimize uv cache
              if: ${{ !cancelled() }}
              run: uv cache prune --ci

    ts-typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '22.x'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Run typecheck
              run: pnpm typecheck

    ts-format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '22.x'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Check format
              run: pnpm format:check

    ts-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '22.x'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build widgets
              run: pnpm build

    py-test:
        runs-on: ubuntu-latest
        env:
            # Dependencies must install from wheels; only inspect_viz is built.
            UV_NO_BUILD: '1'
        strategy:
            matrix:
                python-version: ['3.11', '3.14']
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: meridianlabs-ai/actions/install-python-dependencies@6245f003b5628736e543468ca41f61a42549643f # main
              with:
                  versions: locked
                  python-version: ${{ matrix.python-version }}
                  extras: dev
            - name: Run tests
              run: uv run --no-sync pytest
            - name: Minimize uv cache
              if: ${{ !cancelled() }}
              run: uv cache prune --ci

    py-build:
        runs-on: ubuntu-latest
        env:
            # Dependencies must install from wheels; only inspect_viz is built.
            UV_NO_BUILD: '1'
        strategy:
            matrix:
                python-version: ['3.11', '3.14']
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # The build toolchain that publish.yaml uses, pinned with hashes. To
            # update the file, see publish.yaml.
            - name: Install build toolchain
              uses: meridianlabs-ai/actions/install-python-dependencies@6245f003b5628736e543468ca41f61a42549643f # main
              with:
                  versions: hashed-requirements
                  python-version: ${{ matrix.python-version }}
                  requirements-file: scripts/build-dist/requirements.txt
                  package-format: wheels-only
                  environment-dir: ${{ runner.temp }}/build-venv
                  actions-cache: none
            - name: Build package
              id: build
              run: |
                  "$RUNNER_TEMP/build-venv/bin/python" -m build --no-isolation
                  wheels=(dist/*.whl)
                  [ ${#wheels[@]} -eq 1 ] && [ -f "${wheels[0]}" ] || { echo "::error::expected one wheel in dist/"; exit 1; }
                  # ./ marks a local path for the install action.
                  echo "wheel=./${wheels[0]}" >> "$GITHUB_OUTPUT"
            # The locked runtime dependencies, without the project, then the wheel
            # with --no-deps. A second call in a job must use the first call's
            # actions-cache.
            - uses: meridianlabs-ai/actions/install-python-dependencies@6245f003b5628736e543468ca41f61a42549643f # main
              with:
                  versions: locked
                  python-version: ${{ matrix.python-version }}
                  project-install: skip
                  also-install-without-deps: ${{ steps.build.outputs.wheel }}
                  actions-cache: none
            - name: Verify package
              # -I leaves the working directory off sys.path and ignores PYTHON*
              # variables, so the import can only find the installed wheel.
              run: .venv/bin/python -I -c "import inspect_viz; print('Package imported successfully')"
