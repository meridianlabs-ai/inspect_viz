name: Build

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
            - 'release/**'
    workflow_dispatch:

jobs:
    py-ruff:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ['3.11', '3.14']
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Lint with Ruff
              uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
            - name: Format with Ruff
              uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
              with:
                  args: 'format --check'

    py-mypy:
        runs-on: ubuntu-latest
        env:
            # Dependencies must install from wheels; only inspect_viz is built.
            PIP_ONLY_BINARY: ':all:'
        strategy:
            matrix:
                python-version: ['3.11', '3.14']
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Cache pip dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}-${{ matrix.python-version }}
                  restore-keys: |
                      ${{ runner.os }}-pip-
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install .[dev]
            - name: Run mypy
              run: |
                  mypy src

    ts-typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '22.x'
            - name: Install dependencies
              run: yarn install
            - name: Run typecheck
              run: yarn typecheck

    ts-format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '22.x'
            - name: Install dependencies
              run: yarn install
            - name: Check format
              run: yarn format:check

    ts-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '22.x'
            - name: Install dependencies
              run: yarn install
            - name: Check format
              run: yarn build

    py-test:
        runs-on: ubuntu-latest
        env:
            # Dependencies must install from wheels; only inspect_viz is built.
            PIP_ONLY_BINARY: ':all:'
        strategy:
            matrix:
                python-version: ['3.11', '3.14']
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Cache pip dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}-${{ matrix.python-version }}
                  restore-keys: |
                      ${{ runner.os }}-pip-
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install .[dev]
            - name: Run tests
              run: pytest

    py-build:
        runs-on: ubuntu-latest
        env:
            # Dependencies must install from wheels; only inspect_viz is built.
            PIP_ONLY_BINARY: ':all:'
        strategy:
            matrix:
                python-version: ['3.11', '3.14']
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install build dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install build
            - name: Build package
              run: python -m build
            - name: Verify package
              run: |
                  python -m pip install dist/*.whl
                  python -c "import inspect_viz; print('Package imported successfully')"
