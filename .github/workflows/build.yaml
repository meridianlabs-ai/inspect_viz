name: Build

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
            - 'release/**'
    workflow_dispatch:

jobs:
    py-ruff:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ['3.11', '3.14']
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - name: Lint with Ruff
              uses: chartboost/ruff-action@e18ae971ccee1b2d7bbef113930f00c670b78da4 # v1.0.0
            - name: Format with Ruff
              uses: chartboost/ruff-action@e18ae971ccee1b2d7bbef113930f00c670b78da4 # v1.0.0
              with:
                  args: 'format --check'

    py-mypy:
        runs-on: ubuntu-latest
        env:
            # Dependencies must install from wheels; only inspect_viz is built.
            PIP_ONLY_BINARY: ':all:'
        strategy:
            matrix:
                python-version: ['3.11', '3.14']
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Cache pip dependencies
              uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}-${{ matrix.python-version }}
                  restore-keys: |
                      ${{ runner.os }}-pip-
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install .[dev]
            - name: Run mypy
              run: |
                  mypy src

    ts-typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: '22.x'
            - name: Install dependencies
              run: yarn install
            - name: Run typecheck
              run: yarn typecheck

    ts-format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: '22.x'
            - name: Install dependencies
              run: yarn install
            - name: Check format
              run: yarn format:check

    ts-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: '22.x'
            - name: Install dependencies
              run: yarn install
            - name: Check format
              run: yarn build

    py-test:
        runs-on: ubuntu-latest
        env:
            # Dependencies must install from wheels; only inspect_viz is built.
            PIP_ONLY_BINARY: ':all:'
        strategy:
            matrix:
                python-version: ['3.11', '3.14']
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Cache pip dependencies
              uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}-${{ matrix.python-version }}
                  restore-keys: |
                      ${{ runner.os }}-pip-
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install .[dev]
            - name: Run tests
              run: pytest

    py-build:
        runs-on: ubuntu-latest
        env:
            # Dependencies must install from wheels; only inspect_viz is built.
            PIP_ONLY_BINARY: ':all:'
        strategy:
            matrix:
                python-version: ['3.11', '3.14']
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install build dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install build
            - name: Build package
              run: python -m build
            - name: Verify package
              run: |
                  python -m pip install dist/*.whl
                  python -c "import inspect_viz; print('Package imported successfully')"
