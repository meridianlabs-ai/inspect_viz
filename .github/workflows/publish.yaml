name: Publish Package

on:
    # Auto-publish when Release Please cuts a GitHub Release (the App token it
    # uses is allowed to trigger this). Runs in-repo, so the existing PyPI
    # trusted-publisher config (workflow: publish.yaml) is unchanged.
    release:
        types: [published]
    # Manual break-glass path.
    workflow_dispatch:
        inputs:
            confirm:
                description: 'Type "yes" to confirm PyPI publication'
                required: true
                type: string

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            id-token: write # Required for OIDC/trusted publishing
        environment:
            name: pypi
            url: https://pypi.org/p/inspect_viz

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Get all tags for version detection

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.x'

            - name: Show current version
              run: |
                  echo "Version: $(git describe --tags --always)"

            - name: Build
              run: |
                  pip install --upgrade pip build
                  python -m build
                  ls -la dist/

            - name: Publish to PyPI
              if: ${{ github.event_name == 'release' || inputs.confirm == 'yes' }}
              uses: pypa/gh-action-pypi-publish@release/v1
