version: 2
updates:
  # Keeps the SHA-pinned actions current. Dependabot bumps a `<sha> # vX.Y.Z`
  # pin to the new release's SHA and rewrites the tag comment to match. A
  # `<sha> # main` pin (meridianlabs-ai/actions, until a release tag has the
  # shared Python actions) moves to that branch's head, with no cooldown. The
  # cooldown gives a compromised release time to be caught before it is
  # proposed; security updates skip it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One PR per week for every action update, majors included.
    groups:
      github-actions:
        patterns:
          - "*"
    # pr-title-lint requires a Conventional Commits title; `ci` keeps these
    # out of the release notes.
    commit-message:
      prefix: "ci"
  # Bumps uv.lock. The cooldown matches `exclude-newer` in pyproject.toml. A
  # "6 hours" entry in `exclude-newer-package` there also goes in
  # `cooldown.exclude` and in a `six-hour-cooldown` group listed first
  # (Dependabot's cooldown counts whole days, so it leaves those packages to
  # uv). No package has that entry now. A dated emergency entry is locked by
  # hand.
  - package-ecosystem: "uv"
    versioning-strategy: "lockfile-only"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      python-packages:
        patterns:
          - "*"
    # `build` keeps these out of the release notes.
    commit-message:
      prefix: "build"
  # Bumps the release build toolchain pinned with hashes in
  # scripts/build-dist/requirements.txt.
  - package-ecosystem: "uv"
    directory: "/scripts/build-dist"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      build-toolchain:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
