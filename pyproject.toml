[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "inspect_viz"
dynamic = ["version"]
description = "Data visualization for Inspect AI large language model evalutions."
authors = [{ name = "Meridian Labs" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT License" }
dependencies = [
    "ipython",
    "shortuuid",
    "anywidget>=0.9.0",
    "traitlets>=5.9.0",
    "narwhals>=1.15.1",
    "nest_asyncio",
    "pandas>=2.2.2",
    "pyarrow>=15.0.0",
    "pillow",
    "pydantic",
    "sniffio",
    "typing_extensions>=4.9.0",
]

[project.urls]
Documentation = "https://meridianlabs-ai.github.io/inspect_viz/"
"Source Code" = "https://github.com/meridianlabs-ai/inspect_viz"
"Issue Tracker" = "https://github.com/meridianlabs-ai/inspect_viz/issues"


[project.optional-dependencies]
dev = [
    "watchfiles",
    "jupyterlab",
    "ruff",
    "mypy",
    "datamodel-code-generator",
    "pandas-stubs",
    "playwright",
    "pyarrow-stubs",
    "pytest",
    "pyyaml",
    "types-pillow",
    "types-PyYAML",
]
doc = [
    "quarto-cli>=1.9.36",
    "jupyter",
    "panflute",
    "markdown",
    "griffe",
    "pyyaml",
    "types-PyYAML"
]

[tool.uv]
# 0.11.8 is the first uv that keeps uv.lock stable with a relative exclude-newer,
# and 0.13.4 the first that no longer trusts the compromised emSign root
# (GHSA-hq85-5cpj-mr62).
required-version = ">=0.13.4"
# Only resolve releases at least 7 days old (see CONTRIBUTING.md). No direct
# dependency is a model provider SDK or an Inspect package, so no package has
# a "6 hours" entry in [tool.uv.exclude-newer-package].
exclude-newer = "7 days"

[tool.hatch.build]
only-packages = true
exclude = ["docs/", "tests/"]
artifacts = ["src/inspect_viz/_widgets"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/inspect_viz/_version.py"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version" # Important for PyPI compatibility

[tool.ruff]
extend-exclude = ["docs"]
src = ["."]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # flake8
    "D",      # pydocstyle
    "I",      # isort
    "B",      # flake8-bugbear
    "SIM101", # duplicate isinstance
    # "RET", # flake8-return
    # "RUF", # ruff rules
]
ignore = ["E203", "E501", "D10", "D212", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
